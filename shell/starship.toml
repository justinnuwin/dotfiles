# Starship Shell Prompt Config
# Loaded via shell/modules/prompt.sh when JNSHELL_PROMPT=starship.

add_newline = true
format = """
[╭─](242)\
[](color_orange)\
$username$hostname${env_var.jnshell_starship_show_hostname}$sudo\
[](bg:color_yellow fg:color_orange)\
$directory\
$env_var\
$fill\
[](fg:color_python_blue)\
$python$netns\
[](fg:color_green bg:color_python_blue)\
$cmd_duration\
[](fg:color_aqua bg:color_green)\
$jobs\
[](fg:color_bg bg:color_aqua)\
$time\
[](fg:color_bg)\
$line_break\
[╰─](242)$character"""
right_format = "$status"
command_timeout = 1000
continuation_prompt = " ▶▶ "
palette = 'gruvbox_dark'
[palettes.gruvbox_dark]
color_text = '#fbf1c7'
color_text_dark = '#a0a9cb'
color_bg = '#3c3836'
color_python_blue = '#4b8bbe'
color_python_yellow = '#ffd43b'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d1951f'

[character]
success_symbol        = "[❯](39 bold)"
error_symbol          = "[❯](red bold)"
vimcmd_symbol         = "[❮](39 bold)"
# It appears that Zsh visual sub-modes are not yet working
# https://github.com/starship/starship/issues/625#issuecomment-732454148
vimcmd_visual_symbol  = "[V](39 bold)"
vimcmd_replace_symbol = "[▶](39 bold)"

[sudo]
style  = "fg:color_text bold bg:color_orange"
symbol = " "
format = "[$symbol]($style)"
# Disable sudo segment for now, it can be noticeably slow
disabled = true

[username]
disabled = true

[hostname]
ssh_only = true
ssh_symbol = " "
style = "fg:color_text bold bg:color_orange"
format = "[$ssh_symbol]($style)"

[env_var.jnshell_starship_show_hostname]
variable = "JNSHELL_STARSHIP_SHOW_HOSTNAME"
style    = "fg:color_text bold bg:color_orange"
format   = "[$env_value ]($style)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "fg:color_text bold bg:color_yellow"
format            = "[$path]($style)[$read_only]($read_only_style)"
read_only         = ""
read_only_style   = "fg:color_red bg:color_yellow"

################################################################################
# Git related settings - BEGIN
################################################################################

# Built-in git status sections
# Prompt setting: $git_branch$git_commit$git_state$git_status
# -----------------------------------------------------------

[git_commit]
disabled = true
style         = "fg:color_text bold bg:color_aqua"
format        = '[$hash$tag ]($style)'
only_detached = true
tag_disabled  = true

[git_status]
disabled = true
style       = "fg:color_text bold bg:color_aqua"
format      = "([$all_status$ahead_behind]($style))"
ahead       = "  ${count}"
behind      = "  ${count}"
diverged    = "  ${behind_count}  ${ahead_count}"
up_to_date  = ""
conflicted  = " 󱡝 ${count}"
untracked   = "  ${count}"
modified    = "  ${count}"
staged      = "  ${count}"
renamed     = "  ${count}"
deleted     = "  ${count}"
stashed     = "  ${count}"
typechanged = ""

[git_state]
disabled = true
style        = "fg:red bold bg:color_aqua"
format       = "([$state( $progress_current/$progress_total)]($style))"
rebase       = "REBASING"
merge        = "MERGING"
revert       = "REVERTING"
cherry_pick  = "CHERRY-PICKING"
bisect       = "BISECTING"
am           = "AM"
am_or_rebase = "AM/REBASE"

[git_branch]
disabled = true
symbol            = " "
style             = "fg:color_text bold bg:color_aqua"
format            = "[$symbol $branch]($style)"
truncation_length = 24
truncation_symbol = "…"
ignore_branches   = []


# Gitstatusd-backed "manual" prompt sections
# Prompt setting: $env (this renders all env_var's in declaration order)
# ----------------------------------------------------------------------

[env_var.gsd_head]
variable = "GSD_READY"
format   = "[](fg:color_yellow bg:color_aqua)"

[env_var.gsd_loading]
variable = "GSD_LOADING"
style    = "fg:color_text bg:242"
format   = "[](fg:color_yellow bg:242)[ 󰔟 git status loading]($style)"

[env_var.gsd_on]
variable = "GSD_ON"
style    = "fg:color_text bold bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_action]
variable = "GSD_ACTION"
style    = "fg:red bold bg:color_aqua"
format   = "[ $env_value]($style)"

[env_var.gsd_ahead]
variable = "GSD_AHEAD"
style    = "fg:color_text bold bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_behind]
variable = "GSD_BEHIND"
style    = "fg:color_text bold bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_staged]
variable = "GSD_STAGED"
style    = "fg:color_text bold bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_unstaged]
variable = "GSD_UNSTAGED"
style    = "fg:color_text bold bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_untracked]
variable = "GSD_UNTRACKED"
style    = "fg:color_text bold bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_conflicted]
variable = "GSD_CONFLICTED"
style    = "fg:red bold bg:color_aqua"
format   = "[ 󱡝 $env_value]($style)"

[env_var.gsd_deleted]
variable = "GSD_DELETED"
style    = "fg:color_text bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_stashes]
variable = "GSD_STASHES"
style    = "fg:color_text bold bg:color_aqua"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_on]
variable = "GSD_STALE_ON"
style    = "fg:color_text bold bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_action]
variable = "GSD_STALE_ACTION"
style    = "fg:red bold bg:242"
format   = "[ $env_value]($style)"

[env_var.gsd_stale_ahead]
variable = "GSD_STALE_AHEAD"
style    = "fg:color_text bold bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_behind]
variable = "GSD_STALE_BEHIND"
style    = "fg:color_text bold bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_staged]
variable = "GSD_STALE_STAGED"
style    = "fg:color_text bold bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_unstaged]
variable = "GSD_STALE_UNSTAGED"
style    = "fg:color_text bold bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_untracked]
variable = "GSD_STALE_UNTRACKED"
style    = "fg:color_text bold bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_conflicted]
variable = "GSD_STALE_CONFLICTED"
style    = "fg:red bold bg:242"
format   = "[ 󱡝 $env_value]($style)"

[env_var.gsd_stale_deleted]
variable = "GSD_STALE_DELETED"
style    = "fg:color_text bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_stale_stashes]
variable = "GSD_STALE_STASHES"
style    = "fg:color_text bold bg:242"
format   = "[  $env_value]($style)"

[env_var.gsd_tail]
variable = "GSD_READY"
format   = "[](fg:color_aqua)"

[env_var.gsd_tail_loading]
variable = "GSD_LOADING"
format   = "[](fg:242)"

################################################################################
# Git related settings - END
################################################################################

[status]
symbol                = "✘"
not_executable_symbol = " "
not_found_symbol      = " "
sigint_symbol         = ""
signal_symbol         = ""
style                 = "red bold"
format                = " [$symbol $common_meaning$signal_name$maybe_int]($style)"
disabled = false

[python]
symbol             = " "
style              = "fg:color_python_yellow bold bg:color_python_blue"
format             = "[$symbol$virtualenv ${version}]($style)"
pyenv_version_name = false
detect_files       = []
detect_extensions  = []
generic_venv_names = ['venv', '.venv']
version_format     = "v${major}.${minor}"

[netns]
symbol             = " "
style              = "fg:color_text bold bg:color_python_blue"
format             = "[ $symbol$name]($style)"

[cmd_duration]
min_time = 2000
style    = "fg:color_text bg:color_green"
format   = "[$duration]($style)"

[jobs]
threshold = 1
symbol    = ""
style     = "fg:color_text bold bg:color_aqua"
format    = "[$symbol $number]($style)"

[time]
style       = "fg:color_text_dark bg:color_bg"
format      = "[ $time]($style)"
time_format = "%H:%M:%S"
disabled = false

[fill]
symbol = "·"
style  = "237"
