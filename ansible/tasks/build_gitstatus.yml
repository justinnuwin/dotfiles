---

- name: Refresh apt cache
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    update_cache: true

- name: Install gitstatusd build prerequisites
  become: true
  when: ansible_facts['os_family'] in gitstatus_build_packages
  ansible.builtin.package:
    name: "{{ gitstatus_build_packages[ansible_facts['os_family']] }}"
    state: present
  vars:
    gitstatus_build_packages:
      Debian: [binutils, cmake, gcc, g++, git, make, wget]
      Archlinux: [binutils, cmake, gcc, git, make, wget]
- name: Build gitstatusd (shell/gitstatus submodule)
  ansible.builtin.command:
    cmd: ./build -w
    chdir: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/shell/gitstatus"
    creates: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/shell/gitstatus/usrbin/gitstatusd"
