---
driver:
  name: docker
platforms:
  - name: dotfiles-molecule-ubuntu-20.04
    image: public.ecr.aws/ubuntu/ubuntu:20.04
    pre_build_image: true
  - name: dotfiles-molecule-ubuntu-22.04
    image: public.ecr.aws/ubuntu/ubuntu:22.04
    pre_build_image: true
  - name: dotfiles-molecule-ubuntu-24.04
    image: public.ecr.aws/ubuntu/ubuntu:24.04
    pre_build_image: true
  - name: dotfiles-molecule-archlinux
    image: public.ecr.aws/docker/library/archlinux:latest
    pre_build_image: true
scenario:
  name: default
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
ansible:
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
        ansible_user: root
verifier:
  name: ansible
