---
driver:
  name: podman
platforms:
  - name: dotfiles-molecule-ubuntu-24.04
    image: public.ecr.aws/ubuntu/ubuntu:24.04
    dockerfile: Dockerfile.j2
    command: /sbin/init
    systemd: always
  - name: dotfiles-molecule-archlinux
    image: public.ecr.aws/docker/library/archlinux:latest
    dockerfile: Dockerfile.j2
    command: /sbin/init
    systemd: always
  - name: dotfiles-molecule-ubuntu-24.04-ssh-local
    image: public.ecr.aws/ubuntu/ubuntu:24.04
    dockerfile: Dockerfile.j2
    command: /sbin/init
    systemd: always
scenario:
  name: default
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
ansible:
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
        ansible_user: root
        long_lived_host_role: ssh_remote
    host_vars:
      dotfiles-molecule-ubuntu-24.04-ssh-local:
        long_lived_host_role: ssh_local
verifier:
  name: ansible
