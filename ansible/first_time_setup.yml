---

- name: Deploy dotfiles and related utilities
  hosts: all
  gather_facts: true   # required so ansible_local.dotfiles is loaded for the gating roles
  vars:
    # PATH for tasks that run tools installed by MacPorts (only present on Darwin).
    path_with_macports: "{{ ('/opt/local/bin:' if ansible_facts['os_family'] == 'Darwin' else '') ~ ansible_facts['env']['PATH'] }}"
  pre_tasks:
    - name: Ensure dotfiles repository is available
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/ensure_repository.yml"

    # Roles download installers and releases with curl; macOS ships it.
    - name: Ensure curl is installed
      become: true
      when: ansible_facts['os_family'] != 'Darwin'
      ansible.builtin.package:
        name: curl
        state: present
  roles:
    - mac
    - toolchain
    - starship
    - role: opener_local
      when: long_lived_host_role | default('') == 'ssh_local'
    - role: opener_remote
      when: long_lived_host_role | default('') == 'ssh_remote'
    - role: ssh_to_long_lived_remote
      when: long_lived_host_role | default('') == 'ssh_local'
    - role: long_lived_remote
      when: long_lived_host_role | default('') == 'ssh_remote'
    # Roles are ordered around this role. Roles contributing facts to dotfiles
    # must be before dotfiles_facts. Roles consuming these dotfile facts must
    # be after dotfiles_facts.
    - dotfiles_facts  
    - bash
    - zsh
    - terminfo
    - tmux
    - terminals
    - vim
    - claude
