---

- name: Setup zsh
  block:

  # macOS Catalina (10.15) and later ships zsh as the default shell
  - name: Install zsh (Linux)
    become: true
    when: ansible_facts['os_family'] != 'Darwin'
    ansible.builtin.package:
      name: zsh
      state: present

  - name: Query installed zsh version
    environment:
      PATH: "{{ path_with_macports }}"
    ansible.builtin.command: zsh -c 'echo "$ZSH_VERSION"'
    register: zsh_version
    changed_when: false
    check_mode: false

  - name: Require zsh >= {{ zsh_min_version }}
    ansible.builtin.assert:
      that: zsh_version.stdout is version(zsh_min_version, '>=')
      fail_msg: zsh {{ zsh_version.stdout }} is older than {{ zsh_min_version }}.

  - name: Build gitstatusd
    ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/build_gitstatus.yml"

  - name: Install .zshrc
    ansible.builtin.file:
      src: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/shell/zshrc"
      dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
      state: link
      force: true

  - name: Install .zshenv
    ansible.builtin.file:
      src: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/shell/zshenv"
      dest: "{{ ansible_facts['env']['HOME'] }}/.zshenv"
      state: link
      force: true

  - name: Install .zprofile
    ansible.builtin.file:
      src: "{{ ansible_facts['env']['HOME'] }}/.dotfiles/shell/zprofile"
      dest: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
      state: link
      force: true

  # Renders an ansible-managed block of JNSHELL_* flags inside ~/.localshell.
  # Same task as in roles/bash; idempotent — second blockinfile write is a
  # no-op when the first ran. Hydration is upstream in dotfiles_facts.
  - name: Render ansible-managed block in ~/.localshell
    ansible.builtin.blockinfile:
      path: "{{ ansible_facts['env']['HOME'] }}/.localshell"
      create: true
      mode: "0644"
      marker: "# {mark} ANSIBLE MANAGED BLOCK (dotfiles)"
      block: "{{ lookup('template', playbook_dir ~ '/templates/localshell.j2') }}"

  tags: setup-zsh
