---

# Minimum acceptable bash version, and the release built from source when the
# package is older.
bash_min_version: "5.2.37"

# Linux OS families with a bash package this role can install.
bash_linux_os_families:
  - Debian
  - Archlinux
  - RedHat

# Packages needed to build bash from source, per OS family.
bash_build_packages:
  Debian:
    - build-essential
  RedHat:
    - gcc
    - make
