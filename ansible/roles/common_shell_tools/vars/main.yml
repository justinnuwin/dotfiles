---

# ansible_facts['architecture'] -> fzf release asset arch.
fzf_release_arch:
  x86_64: amd64
  aarch64: arm64

fzf_release_url: >-
  https://github.com/junegunn/fzf/releases/download/v{{ fzf_version }}/fzf-{{ fzf_version }}-linux_{{
  fzf_release_arch[ansible_facts['architecture']] }}.tar.gz

# musl builds are static, so they run on old glibc releases.
fd_release_url: >-
  https://github.com/sharkdp/fd/releases/download/v{{ fd_version }}/fd-v{{ fd_version }}-{{
  ansible_facts['architecture'] }}-unknown-linux-musl.tar.gz

# The fzf binary linked into the fzf repository for fzf-zsh-plugin.
fzf_bin: "{{ '/opt/local/bin/fzf' if ansible_facts['os_family'] == 'Darwin' else fzf_dir ~ '/fzf' }}"
